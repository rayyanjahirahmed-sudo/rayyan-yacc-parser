<!DOCTYPE html>
<html>
<head>
    <title>YACC Arithmetic Expression Parser</title>
</head>
<body>

    <h1>YACC Arithmetic Expression Parser</h1>

    <p>
        Enter an arithmetic expression to check its structure
        and operator precedence.
    </p>

    <input type="text" id="expression" placeholder="Example: (10 + 20) * 5">

    <button>Parse Expression</button>

    <h2>Result</h2>

    <p id="result">Enter an expression above.</p>

</body>
</html>
