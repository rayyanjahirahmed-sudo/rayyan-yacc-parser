<!DOCTYPE html>
<html>
<head>
    <title>YACC While-Loop Parser</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>YACC While-Loop Parser</h1>

    <p>
        Enter a while-loop to check whether it follows the defined grammar.
    </p>

    <input
        type="text"
        id="input"
        placeholder="Example: while (x < 10) x = x + 1;"
    >

    <button onclick="parseInput()">Parse</button>

    <h2>Result</h2>

    <p id="result">Enter a while-loop above.</p>

    <script>
        function parseInput() {
            let input = document.getElementById("input").value.trim();
            let result = document.getElementById("result");

            let pattern =
                /^while\s*\(\s*[a-zA-Z][a-zA-Z0-9]*\s*<\s*[0-9]+\s*\)\s*[a-zA-Z][a-zA-Z0-9]*\s*=\s*[a-zA-Z][a-zA-Z0-9]*\s*\+\s*[0-9]+\s*;$/;

            if (pattern.test(input)) {
                result.textContent = "Valid while-loop";
            } else {
                result.textContent = "Invalid while-loop";
            }
        }
    </script>

</body>
</html>
